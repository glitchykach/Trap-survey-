<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ساخت لیست تصویری</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{
    --bg:#0c0a14; --bg2:#171129; --panel:#1a1526; --text:#f2eefb; --muted:#8b86a3;
    --accent:#7c68e8; --accent2:#ff7a59; --border:#2c2640; --box:#221c34;
    --gold:#c9992e;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  :root[data-theme="light"]{
    --bg:#eef0fb; --bg2:#f6ecff; --panel:#ffffff; --text:#1c1a24; --muted:#7a7690;
    --accent:#6d5bd0; --accent2:#ff7a59; --border:#e6e2f2; --box:#f1eef9;
  }
  *{box-sizing:border-box;}
  html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%;}
  body{
    min-height:100%; margin:0; color:var(--text);
    font-family:"Vazirmatn","Segoe UI",Tahoma,sans-serif;
    display:flex; justify-content:center; padding:24px 14px 50px;
    background:radial-gradient(1100px 460px at 50% -10%, var(--bg2), var(--bg));
  }
  .wrap{width:100%; max-width:460px;}
  h1{font-size:1rem; font-weight:700; margin:0 0 16px; text-align:center; color:var(--muted);}

  .card{
    background:var(--panel); border:1px solid var(--border); border-radius:20px;
    padding:16px; box-shadow:0 18px 40px rgba(0,0,0,.35);
  }

  #capture-area{ background:var(--panel); padding:10px 4px 2px; border-radius:14px; }

  #titleBox{
    font-size:1.6rem; font-weight:800; text-align:center; padding:6px 8px 14px;
    outline:none; border-bottom:2px dashed var(--border); margin-bottom:14px;
    cursor:text; color:var(--text); min-height:1.6em; line-height:1.5em;
    word-break:break-word;
  }
  #titleBox:empty::before{ content:attr(data-placeholder); color:var(--muted); font-weight:600; }
  #titleBox:focus{ border-bottom-color:var(--accent); }

  .grid{
    display:grid; grid-template-columns:repeat(2,1fr); gap:10px;
  }

  .box{
    position:relative; aspect-ratio:1/1; background:var(--box);
    border:1px solid var(--border); border-radius:14px; overflow:hidden;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .box:hover{ box-shadow:0 6px 18px rgba(0,0,0,.3); }
  .box:active{ transform:scale(.97); }
  .box img{ width:100%; height:100%; object-fit:cover; display:block; }
  .box .plus{ font-size:2.1rem; color:var(--muted); font-weight:300; pointer-events:none; }
  .box .rm{
    position:absolute; top:6px; left:6px; width:26px; height:26px; border-radius:50%;
    background:rgba(0,0,0,.6); color:#fff; font-size:15px; line-height:26px; text-align:center;
    display:none; z-index:2; cursor:pointer;
  }
  .box.filled .rm{ display:block; }
  .box .rm:active{ background:rgba(0,0,0,.8); }

  .actions{ display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-top:20px; }
  button.dl{
    border:none; padding:11px 16px; border-radius:11px; font-size:.86rem; font-weight:700;
    cursor:pointer; color:#fff; background:var(--accent); transition:opacity .15s ease, transform .1s ease;
  }
  button.dl:hover{ opacity:.9; }
  button.dl:active{ transform:scale(.97); }
  button.dl.alt{ background:var(--accent2); }
  button.dl:disabled{ opacity:.5; cursor:default; transform:none; }

  .goldnote{
    text-align:center; color:var(--gold); font-weight:700; font-size:.7rem;
    margin-top:12px; line-height:1.7;
  }
  .hint{ text-align:center; color:var(--muted); font-size:.76rem; margin-top:8px; }
  input[type=file]{ display:none; }

  /* off-screen node used only to render the high-res export */
  #export-area{
    position:fixed; top:0; left:-10000px; width:900px;
    background:var(--panel); padding:36px 30px 26px; border-radius:22px;
  }
  #export-area .exp-title{
    font-family:"Vazirmatn","Segoe UI",Tahoma,sans-serif; font-weight:800; font-size:54px;
    text-align:center; color:var(--text); margin-bottom:30px; line-height:1.4; direction:rtl;
  }
  #export-area .exp-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:22px; }
  #export-area .exp-box{
    aspect-ratio:1/1; border-radius:20px; overflow:hidden; background:var(--box);
    border:1px solid var(--border);
  }
  #export-area .exp-box img{ width:100%; height:100%; object-fit:cover; display:block; }
</style>
</head>
<body>
<div class="wrap">
  <h1>یک عنوان بنویس، عکس‌ها رو انتخاب کن، خروجی بگیر</h1>
  <div class="card">
    <div id="capture-area">
      <div id="titleBox" contenteditable="true" data-placeholder="عنوان را اینجا بنویس... مثلا My Favorite DC Characters"></div>
      <div class="grid" id="grid"></div>
    </div>
    <div class="actions">
      <button class="dl" id="dlJpg">دانلود JPG</button>
      <button class="dl alt" id="dlPng">دانلود PNG</button>
      <button class="dl alt" id="dlWebp">دانلود WEBP</button>
    </div>
    <div class="goldnote">برای رعایت حقوق سازنده یعنی ترپ، ترجیحا فقط پسر و کاراکتر مرد بگذارید</div>
    <div class="hint">روی هر کادر کلیک کن تا عکس انتخاب کنی. برای حذف عکس، روی دایره کوچک بالا-چپ کادر بزن.</div>
  </div>
</div>

<script>
const grid = document.getElementById('grid');
const titleBox = document.getElementById('titleBox');

titleBox.addEventListener('input', ()=>{
  if(titleBox.textContent.trim() === ''){ titleBox.innerHTML = ''; }
});
titleBox.addEventListener('keydown', (e)=>{
  if(e.key === 'Enter'){ e.preventDefault(); titleBox.blur(); }
});

for(let i=0;i<10;i++){
  const box = document.createElement('div');
  box.className = 'box';
  box.innerHTML = `<span class="plus">+</span><span class="rm">✕</span><input type="file" accept="image/*">`;
  const input = box.querySelector('input');
  const rm = box.querySelector('.rm');
  const plus = box.querySelector('.plus');

  box.addEventListener('click', (e)=>{
    if(e.target === rm) return;
    input.click();
  });

  input.addEventListener('change', ()=>{
    const file = input.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (ev)=>{
      plus.style.display = 'none';
      let img = box.querySelector('img');
      if(!img){
        img = document.createElement('img');
        box.insertBefore(img, box.firstChild);
      }
      img.src = ev.target.result;
      box.classList.add('filled');
    };
    reader.readAsDataURL(file);
  });

  rm.addEventListener('click', (e)=>{
    e.stopPropagation();
    const img = box.querySelector('img');
    if(img) img.remove();
    plus.style.display = '';
    box.classList.remove('filled');
    input.value = '';
  });

  grid.appendChild(box);
}

const buttons = [
  document.getElementById('dlJpg'),
  document.getElementById('dlPng'),
  document.getElementById('dlWebp')
];

let downloadsCap = null;
(async () => {
  try { downloadsCap = await claude.use('downloads'); } catch(e) { downloadsCap = null; }
})();

// builds a clean, fixed-size, high-res node (no title cursor, no remove buttons)
// used only at export time so quality and layout never depend on the viewer's screen size.
function buildExportNode(){
  const node = document.createElement('div');
  node.id = 'export-area';

  const t = document.createElement('div');
  t.className = 'exp-title';
  t.textContent = titleBox.textContent.trim() || 'My List';
  node.appendChild(t);

  const g = document.createElement('div');
  g.className = 'exp-grid';
  grid.querySelectorAll('.box').forEach(box=>{
    const img = box.querySelector('img');
    const b = document.createElement('div');
    b.className = 'exp-box';
    if(img){
      const im = document.createElement('img');
      im.src = img.src;
      b.appendChild(im);
    }
    g.appendChild(b);
  });
  node.appendChild(g);

  document.body.appendChild(node);
  return node;
}

async function download(type, ext){
  buttons.forEach(b => b.disabled = true);
  const exportNode = buildExportNode();
  try{
    const canvas = await html2canvas(exportNode, {backgroundColor: getComputedStyle(exportNode).backgroundColor, scale: 2, useCORS: true});
    const mime = type === 'jpg' ? 'image/jpeg' : type === 'webp' ? 'image/webp' : 'image/png';
    const blob = await new Promise((resolve)=>{
      canvas.toBlob((b)=>resolve(b), mime, 0.95);
    });
    if(!blob) return;

    if(!downloadsCap){
      try { downloadsCap = await claude.use('downloads'); } catch(e) { downloadsCap = null; }
    }

    if(downloadsCap){
      try{
        await downloadsCap.save({ filename: 'list.' + ext, data: blob });
      }catch(err){
        console.error(err);
        alert('دانلود انجام نشد. لطفاً دوباره امتحان کن.');
      }
    } else {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'list.' + ext;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }
  } finally {
    exportNode.remove();
    buttons.forEach(b => b.disabled = false);
  }
}

document.getElementById('dlJpg').addEventListener('click', ()=>download('jpg','jpg'));
document.getElementById('dlPng').addEventListener('click', ()=>download('png','png'));
document.getElementById('dlWebp').addEventListener('click', ()=>download('webp','webp'));
</script>
</body>
</html>
